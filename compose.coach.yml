services:
  api:
    environment:
      LINGUALOOP_OPENAI_API_KEY_FILE: /run/secrets/lingualoop_openai_api_key
      LANGUAGE_PRACTICE_OPENAI_MODEL: ${LANGUAGE_PRACTICE_OPENAI_MODEL:?Set LANGUAGE_PRACTICE_OPENAI_MODEL to an allowed coach model}
    secrets:
      - source: lingualoop_openai_api_key
        target: lingualoop_openai_api_key
        mode: 0400

secrets:
  lingualoop_openai_api_key:
    file: ${LINGUALOOP_OPENAI_API_KEY_FILE:?Set LINGUALOOP_OPENAI_API_KEY_FILE to the host coach.env path}
