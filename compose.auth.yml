services:
  api:
    environment:
      LINGUALOOP_TOKEN_SIGNING_KEY_FILE: /run/secrets/lingualoop_token_signing_key
      LINGUALOOP_WEB_ORIGIN: ${LINGUALOOP_WEB_ORIGIN:?Set the exact browser-facing web origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL:-}
    secrets:
      - source: lingualoop_token_signing_key
        target: lingualoop_token_signing_key
        mode: 0400

secrets:
  lingualoop_token_signing_key:
    file: ${LINGUALOOP_TOKEN_SIGNING_KEY_FILE:?Set LINGUALOOP_TOKEN_SIGNING_KEY_FILE to the host signing-key file}
