services:
  api:
    env_file:
      - ${LINGUALOOP_GOOGLE_ENV_FILE:?Set LINGUALOOP_GOOGLE_ENV_FILE to the host Google auth env file}
    environment:
      LINGUALOOP_TOKEN_SIGNING_KEY_FILE: /run/secrets/lingualoop_token_signing_key
    secrets:
      - source: lingualoop_token_signing_key
        target: lingualoop_token_signing_key
        mode: 0400

secrets:
  lingualoop_token_signing_key:
    file: ${LINGUALOOP_TOKEN_SIGNING_KEY_FILE:?Set LINGUALOOP_TOKEN_SIGNING_KEY_FILE to the host signing-key file}
