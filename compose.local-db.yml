# Isolated host-local development database. Does not reuse or alter the historical LinguaLoop volume.
name: lingualoop-local-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: lingualoop-local-postgres
    restart: "no"
    environment:
      POSTGRES_DB: lingualoop
      POSTGRES_USER: lingualoop
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - lingualoop-local-dev-postgres-data:/var/lib/postgresql/data
    secrets:
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  pg_password:
    file: ${LINGUALOOP_DB_PASSWORD_FILE:?Set LINGUALOOP_DB_PASSWORD_FILE in the root .env}

volumes:
  lingualoop-local-dev-postgres-data:
    name: lingualoop-local-dev-postgres-data
