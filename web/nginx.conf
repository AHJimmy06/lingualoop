server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match Vite's /api prefix rewrite, including the bare prefix.
    location = /api {
        return 308 /api/$is_args$args;
    }

    location ^~ /api/ {
        # The trailing slash strips /api/ while retaining query parameters.
        proxy_pass http://lingualoop-api-1:5000/;
        proxy_http_version 1.1;
        # Match Vite changeOrigin for Host, but never rewrite browser Origin.
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # Keep API/Google redirects and cookie paths unchanged.
        proxy_redirect off;
        # Audio upload/processing must not inherit nginx's small defaults.
        client_max_body_size 100m;
        proxy_read_timeout 1200s;
    }

    # OAuth providers return to the browser origin, then this path forwards
    # the exact registered callback path to the private API container.
    location ^~ /auth/ {
        proxy_pass http://lingualoop-api-1:5000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # Missing build assets are real 404s, not HTML responses.
    location /assets/ {
        try_files $uri =404;
    }
    location /images/ {
        try_files $uri =404;
    }

    # React Router deep links must receive the packaged entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
