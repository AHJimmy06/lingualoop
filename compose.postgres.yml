name: lingualoop

services:
  postgres:
    image: postgres:16-alpine
    container_name: lingualoop-postgres
    restart: "no"
    environment:
      POSTGRES_DB: lingualoop
      POSTGRES_USER: lingualoop
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - lingualoop-postgres-data:/var/lib/postgresql/data
    networks:
      - lingualoop-postgres-net
    secrets:
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: "no"
    environment:
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - lingualoop-postgres-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  pg_password:
    file: ${LINGUALOOP_DB_PASSWORD_FILE:?Set LINGUALOOP_DB_PASSWORD_FILE to the host password file}

volumes:
  lingualoop-postgres-data:
    name: lingualoop-postgres-data

networks:
  lingualoop-postgres-net:
    name: lingualoop-postgres-net
    driver: bridge
