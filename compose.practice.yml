services:
  api:
    volumes:
      - type: bind
        source: ${LINGUALOOP_STT_VENV_DIR:?Set LINGUALOOP_STT_VENV_DIR}
        target: ${LINGUALOOP_STT_VENV_DIR:?Set LINGUALOOP_STT_VENV_DIR}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LINGUALOOP_STT_PYTHON_DIST_DIR:?Set LINGUALOOP_STT_PYTHON_DIST_DIR}
        target: ${LINGUALOOP_STT_PYTHON_DIST_DIR:?Set LINGUALOOP_STT_PYTHON_DIST_DIR}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LANGUAGE_PRACTICE_FASTCONFORMER_MODEL_PATH:?Set LANGUAGE_PRACTICE_FASTCONFORMER_MODEL_PATH}
        target: ${LANGUAGE_PRACTICE_FASTCONFORMER_MODEL_PATH:?Set LANGUAGE_PRACTICE_FASTCONFORMER_MODEL_PATH}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LINGUALOOP_PIPER_RUNTIME_DIR:?Set LINGUALOOP_PIPER_RUNTIME_DIR}
        target: ${LINGUALOOP_PIPER_RUNTIME_DIR:?Set LINGUALOOP_PIPER_RUNTIME_DIR}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LANGUAGE_PRACTICE_FFMPEG_PATH:?Set LANGUAGE_PRACTICE_FFMPEG_PATH}
        target: ${LANGUAGE_PRACTICE_FFMPEG_PATH:?Set LANGUAGE_PRACTICE_FFMPEG_PATH}
        read_only: true
        bind:
          create_host_path: false
    environment:
      LINGUALOOP_STT_PYTHON: ${LINGUALOOP_STT_PYTHON:?Set LINGUALOOP_STT_PYTHON}
      LINGUALOOP_STT_VENV_DIR: ${LINGUALOOP_STT_VENV_DIR:?Set LINGUALOOP_STT_VENV_DIR}
      LINGUALOOP_STT_PYTHON_DIST_DIR: ${LINGUALOOP_STT_PYTHON_DIST_DIR:?Set LINGUALOOP_STT_PYTHON_DIST_DIR}
      LINGUALOOP_FASTCONFORMER_MODEL_PATH: ${LANGUAGE_PRACTICE_FASTCONFORMER_MODEL_PATH:?Set LANGUAGE_PRACTICE_FASTCONFORMER_MODEL_PATH}
      LINGUALOOP_FASTCONFORMER_MODEL_SHA256: ${LANGUAGE_PRACTICE_FASTCONFORMER_MODEL_SHA256:?Set LANGUAGE_PRACTICE_FASTCONFORMER_MODEL_SHA256}
      LINGUALOOP_PIPER_RUNTIME_DIR: ${LINGUALOOP_PIPER_RUNTIME_DIR:?Set LINGUALOOP_PIPER_RUNTIME_DIR}
      LANGUAGE_PRACTICE_PIPER_PATH: ${LANGUAGE_PRACTICE_PIPER_PATH:?Set LANGUAGE_PRACTICE_PIPER_PATH}
      LANGUAGE_PRACTICE_PIPER_MODEL_EN: ${LANGUAGE_PRACTICE_PIPER_MODEL_EN:?Set LANGUAGE_PRACTICE_PIPER_MODEL_EN}
      LANGUAGE_PRACTICE_PIPER_MODEL_ES: ${LANGUAGE_PRACTICE_PIPER_MODEL_ES:?Set LANGUAGE_PRACTICE_PIPER_MODEL_ES}
      LANGUAGE_PRACTICE_FFMPEG_PATH: ${LANGUAGE_PRACTICE_FFMPEG_PATH:?Set LANGUAGE_PRACTICE_FFMPEG_PATH}
      LINGUALOOP_PIPER_MODEL_EN_SHA256: ${LINGUALOOP_PIPER_MODEL_EN_SHA256:?Set LINGUALOOP_PIPER_MODEL_EN_SHA256}
      LINGUALOOP_PIPER_SIDECAR_EN_SHA256: ${LINGUALOOP_PIPER_SIDECAR_EN_SHA256:?Set LINGUALOOP_PIPER_SIDECAR_EN_SHA256}
      LINGUALOOP_PIPER_MODEL_ES_SHA256: ${LINGUALOOP_PIPER_MODEL_ES_SHA256:?Set LINGUALOOP_PIPER_MODEL_ES_SHA256}
      LINGUALOOP_PIPER_SIDECAR_ES_SHA256: ${LINGUALOOP_PIPER_SIDECAR_ES_SHA256:?Set LINGUALOOP_PIPER_SIDECAR_ES_SHA256}
      LD_LIBRARY_PATH: ${LINGUALOOP_PIPER_RUNTIME_DIR:?Set LINGUALOOP_PIPER_RUNTIME_DIR}
