# Portainer Docker Standalone API stack. PostgreSQL is reached on the existing
# proxy-network using its `postgres` network alias. STT stays private in API.
name: lingualoop-api

services:
  api:
    image: ${LINGUALOOP_API_IMAGE:-ghcr.io/ahjimmy06/lingualoop-api:latest}
    container_name: lingualoop-api-1
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      PORT: "5000"
      LINGUALOOP_WEB_ORIGIN: ${LINGUALOOP_WEB_ORIGIN:?Set the address used to open the app, e.g. http://10.102.100.188}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL:-}
      LINGUALOOP_DB_HOST: postgres
      LINGUALOOP_DB_PORT: "5432"
      LINGUALOOP_DB_PASSWORD: ${LINGUALOOP_DB_PASSWORD:?Set the existing PostgreSQL password}
      LINGUALOOP_TOKEN_SIGNING_KEY: ${LINGUALOOP_TOKEN_SIGNING_KEY:?Set a private random signing key (32+ characters)}
      LINGUALOOP_STT_ENABLED: "true"
      LINGUALOOP_STT_START_MODE: managed
      LINGUALOOP_STT_SERVER_URL: http://127.0.0.1:8080
      LINGUALOOP_STT_PORT: "8080"
      LINGUALOOP_STT_MODEL: base.en
      LINGUALOOP_STT_CPU_THREADS: "4"
      LINGUALOOP_STT_PYTHON: /opt/lingualoop-stt/bin/python
      HF_HOME: /models/huggingface
      LANGUAGE_PRACTICE_FFMPEG_PATH: /usr/local/bin/ffmpeg
    volumes:
      - lingualoop-whisper-model-cache:/models
    networks:
      - lingualoop-postgres-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

volumes:
  lingualoop-whisper-model-cache:
    name: lingualoop-whisper-model-cache

networks:
  lingualoop-postgres-net:
    external: true
    name: proxy-network
