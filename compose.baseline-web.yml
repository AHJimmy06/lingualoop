# Standalone frontend project: never combine with the API/database overlays.
name: lingualoop-baseline-web

services:
  web:
    image: ${LINGUALOOP_WEB_IMAGE:-ghcr.io/ahjimmy06/lingualoop-web:latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:5001:80"
    networks:
      - existing-api

networks:
  existing-api:
    external: true
    # Explicit name from compose.postgres.yml; this file cannot create it.
    name: lingualoop-postgres-net
