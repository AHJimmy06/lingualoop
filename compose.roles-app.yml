# App override ONLY for compose.roles-integration.yml, after cluster isolation proof.
# Do not include this file for DB-only operations: interpolation precedes profiles.
name: lingualoop-roles-t4

services:
  api:
    profiles: [app]
    image: ${LINGUALOOP_ROLES_API_IMAGE:?Set a fresh unique integrated roles API image tag}
    pull_policy: never
    container_name: lingualoop-roles-t4-api
    restart: "no"
    # Bypass image wrapper scripts: no migrations/bootstrap at container startup.
    entrypoint: [node]
    command: [dist/main.js]
    env_file:
      - ${LINGUALOOP_ROLES_GOOGLE_ENV_FILE:?Set a dedicated external roles Google auth env file}
    environment:
      NODE_ENV: production
      PORT: "5000"
      LINGUALOOP_DB_HOST: postgres
      LINGUALOOP_DB_PORT: "5432"
      LINGUALOOP_DB_PASSWORD_FILE: /run/secrets/roles_db_password
      LINGUALOOP_TOKEN_SIGNING_KEY_FILE: /run/secrets/roles_token_signing_key
      GOOGLE_CALLBACK_URL: http://127.0.0.1:5100/auth/google/callback
      LINGUALOOP_WEB_ORIGIN: http://127.0.0.1:5101
    secrets:
      - roles_db_password
      - source: roles_token_signing_key
        target: roles_token_signing_key
        mode: 0400
    ports:
      - "127.0.0.1:5100:5000"
    networks:
      - roles-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    profiles: [app]
    image: ${LINGUALOOP_ROLES_WEB_IMAGE:?Set a fresh unique integrated roles web image tag}
    pull_policy: never
    container_name: lingualoop-roles-t4-web
    restart: "no"
    ports:
      - "127.0.0.1:5101:80"
    volumes:
      - type: bind
        source: ./deploy/roles/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - roles-net
    depends_on:
      api:
        condition: service_healthy

secrets:
  roles_token_signing_key:
    file: ${LINGUALOOP_ROLES_TOKEN_SIGNING_KEY_FILE:?Set a fresh external roles-only signing key file}
